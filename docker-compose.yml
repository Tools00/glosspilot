services:
  postgres:
    image: postgres:16-alpine
    container_name: glosspilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: glosspilot
      POSTGRES_PASSWORD: glosspilot
      POSTGRES_DB: glosspilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glosspilot"]
      interval: 5s
      timeout: 3s
      retries: 5

  adminer:
    image: adminer:4
    container_name: glosspilot-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
